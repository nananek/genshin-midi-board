switches:
  - ref: SW1
    part: "NKK 115643 (Akizuki 115643)"
    type: slide
    function: "genshin mode / HID mute"
    gpio: 28
    net: SW1_MUTE
    rp2040_pin: 40
    active: low
    debounce_ms: 20
    wiring: "pin2=GP28, pin3=GND, pin1=NC"
    x_mm: 5.2
    y_mm: 9.0
    rotation_deg: 90
    body: [1.95, 3.9, 6.5, 10.2]
  - ref: SW2
    part: "NKK 115643 (Akizuki 115643)"
    type: slide
    function: "lyre mode / Sumeru scale"
    gpio: 29
    net: SW2_LYRE
    rp2040_pin: 41
    active: low
    debounce_ms: 20
    wiring: "pin2=GP29, pin3=GND, pin1=NC"
    x_mm: 5.2
    y_mm: 24.5
    rotation_deg: 90
    body: [1.95, 19.4, 6.5, 10.2]
  - ref: SW3
    part: "NKK 115643 (Akizuki 115643)"
    type: slide
    function: "sustain / MIDI CC64"
    gpio: 27
    net: SW3_SUSTAIN
    rp2040_pin: 39
    active: low
    debounce_ms: 20
    wiring: "pin2=GP27, pin3=GND, pin1=NC"
    x_mm: 55.5
    y_mm: 12.5
    rotation_deg: 270
    body: [52.25, 7.4, 6.5, 10.2]
  - ref: SW4
    part: "NKK 115643 (Akizuki 115643)"
    type: slide
    function: "USB-A VBUS manual enable"
    gpio: null
    net: null
    rp2040_pin: null
    active: high
    debounce_ms: 0
    wiring: "pin2=TPS2553 EN, pin3=+3V3, pin1=NC; 100k pull-down on EN"
    x_mm: 15.0
    y_mm: 31.5
    rotation_deg: 0
    body: [9.9, 28.25, 10.2, 6.5]
  - ref: SW6
    part: "Akizuki DTS-63-N-V-BLK (103647)"
    type: tact
    function: "MIDI reset (CC123 + CC121)"
    gpio: 14
    net: SW6_RESET
    rp2040_pin: 17
    active: low
    debounce_ms: 20
    wiring: "pins1/2=GND, pins3/4=GP14"
    x_mm: 31.0
    y_mm: 4.2
    rotation_deg: 0
    body: [26.7, 0.8, 8.6, 6.8]

pinmap:
  - signal: "PIO-USB D+"
    rp2040_pin: 15
    gpio: 12
    net: "USB_A_DP_GP12"
    destination: "22R -> U6 -> J2 D+"
    note: "PIO-USB requires D- on D+ + 1"
  - signal: "PIO-USB D-"
    rp2040_pin: 16
    gpio: 13
    net: "USB_A_DM_GP13"
    destination: "22R -> U6 -> J2 D-"
    note: ""
  - signal: "CH345 MIN (RP2040 TX)"
    rp2040_pin: 6
    gpio: 4
    net: "MIDI_UART_TX"
    destination: "CH345 pin 4 (MIN)"
    note: "UART1 TX, 31250 8N1"
  - signal: "CH345 MOUT (RP2040 RX)"
    rp2040_pin: 7
    gpio: 5
    net: "MIDI_UART_RX"
    destination: "CH345 pin 3 (MOUT)"
    note: "UART1 RX, 31250 8N1"
  - signal: "native USB D+"
    rp2040_pin: 47
    gpio: null
    net: "USB_PC_DP"
    destination: "27R -> U7 -> J1 D+"
    note: "RP2040 USB_DP"
  - signal: "native USB D-"
    rp2040_pin: 46
    gpio: null
    net: "USB_PC_DM"
    destination: "27R -> U7 -> J1 D-"
    note: "RP2040 USB_DM"
  - signal: "mute switch"
    rp2040_pin: 40
    gpio: 28
    net: "SW1_MUTE"
    destination: "SW1 pin2"
    note: "internal pull-up, active low"
  - signal: "lyre switch"
    rp2040_pin: 41
    gpio: 29
    net: "SW2_LYRE"
    destination: "SW2 pin2"
    note: "internal pull-up, active low"
  - signal: "sustain switch"
    rp2040_pin: 39
    gpio: 27
    net: "SW3_SUSTAIN"
    destination: "SW3 pin2"
    note: "internal pull-up, active low"
  - signal: "MIDI reset button"
    rp2040_pin: 17
    gpio: 14
    net: "SW6_RESET"
    destination: "SW6 pins 3/4"
    note: "internal pull-up, active low"
  - signal: "status LED"
    rp2040_pin: 37
    gpio: 25
    net: "STATUS_LED"
    destination: "1k -> LED1 -> GND"
    note: "active high"
  - signal: "QSPI flash"
    rp2040_pin: "51-56"
    gpio: null
    net: "QSPI_*"
    destination: "U2 W25Q128"
    note: "dedicated QSPI pins, not GPIO"
  - signal: "crystal"
    rp2040_pin: "20/21"
    gpio: null
    net: "XIN/XOUT"
    destination: "Y1 12MHz"
    note: "15 pF load caps, 1k series on XOUT"
  - signal: "RUN"
    rp2040_pin: 26
    gpio: null
    net: "RUN"
    destination: "R19 10k pull-up to +3V3"
    note: ""
  - signal: "BOOTSEL"
    rp2040_pin: 56
    gpio: null
    net: "QSPI_SS"
    destination: "TP7 via 1k to GND when pressed"
    note: "do not hold low during normal boot"

