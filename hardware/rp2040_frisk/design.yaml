project:
  name: rp2040_frisk_midi_hid
  title: "RP2040 Frisk MIDI to NKRO HID + USB-MIDI"
  revision: "A"
  status: design-study
  date: "2026-11-23"
  source_references:
    - "https://github.com/nananek/waveshare-genshin-midi-keyboard"
    - "https://github.com/nananek/serial-km-emulator"
    - "https://github.com/nananek/serial-km-emulator/pull/22"
    - "https://github.com/nananek/serial-km-emulator/pull/23"

board:
  width_mm: 62.0
  height_mm: 35.0
  thickness_mm: 1.6
  layers: 4
  chamfer_mm: 2.0
  corner_cut: "45-degree punch cut on all four corners"
  origin: "top-left"
  mounting_holes: []
  finish: "HASL lead-free"
  solder_mask: "green"
  silkscreen: "white"

stackup:
  - layer: "F.Cu"
    role: "signal, USB, components, GND pour"
    copper_oz: 1.0
  - layer: "In1.Cu"
    role: "solid GND plane"
    copper_oz: 0.5
  - layer: "In2.Cu"
    role: "+3V3 plane, split only outside the USB/crystal area"
    copper_oz: 0.5
  - layer: "B.Cu"
    role: "signal, GND pour, THT solder side"
    copper_oz: 1.0

fabrication:
  vendor: JLCPCB
  process: "standard 4-layer"
  via_diameter_mm: 0.5
  via_drill_mm: 0.3
  allowed_via_diameters_mm: [0.5, 0.45]
  allowed_via_drills_mm: [0.3, 0.25]
  min_trace_mm: 0.1
  min_space_mm: 0.1
  min_hole_clearance_mm: 0.2
  preferred_signal_trace_mm: 0.15
  power_trace_mm: 0.8
  usb_trace_mm: 0.2
  qfn_escape_trace_mm: 0.127
  via_in_pad: false
  plugged_vias: false
  capped_vias: false
  filled_vias: false
  blind_or_buried_vias: false
  advanced_via_process: false
  impedance_control: false
  assembly_side: "top only"
  notes:
    - "PR #22 の教訓: 0.15 mm ドリルは JLCPCB の advanced オプションを誘発する。通常は 0.5/0.3 mm、最後の 1 本だけ 0.45/0.25 mm を使う。"
    - "PR #22 の教訓: via covering は tented のままにし、plugged にしない。"
    - "配線間隔は 0.1 mm、ホール間隔は 0.2 mm、ビア径は 0.45 mm 以上を JLCPCB 4 層の標準範囲として使う。発注画面で確認する。"
    - "Type-C の A7/B7 はパッド内ビアを使わず、ドッグボーンでパッド外の 0.5/0.3 mm ビアへ逃がす。"
    - "QFN-56 のサーマルパッド内にビアを置かない。パッド外のビアと F.Cu の GND で接続する。"

ports:
  - id: keyboard
    connector: J2
    type: "USB-A host"
    role: "KORG microKEY2 (USB-MIDI, bus-powered)"
    controller: "RP2040 PIO-USB host"
    pins: "GP12 (D+), GP13 (D-)"
    power: "TPS2553 current-limited 5 V, SW4 manual enable"
  - id: pc
    connector: J1
    type: "USB-C device"
    role: "NKRO HID keyboard to PC"
    controller: "RP2040 native USB"
    pins: "USB_DP (pin 47), USB_DM (pin 46)"
    power: "VBUS sink, 5.1 kOhm Rd on CC1/CC2"
  - id: ipad
    connector: J3
    type: "USB-C device"
    role: "USB-MIDI device to iPad"
    controller: "CH345T"
    pins: "UD+ / UD-"
    power: "VBUS sink, 5.1 kOhm Rd on CC1/CC2"

connectors:
  - ref: J1
    type: "USB-C receptacle"
    part: "HRO TYPE-C-31-M-12"
    lcsc: C165948
    x_mm: 16.5
    y_mm: 2.4
    rotation_deg: 180
    edge: top
    mouth: up
    courtyard: [11.18, 0.0, 10.64, 7.67]
  - ref: J3
    type: "USB-C receptacle"
    part: "HRO TYPE-C-31-M-12"
    lcsc: C165948
    x_mm: 45.5
    y_mm: 2.4
    rotation_deg: 180
    edge: top
    mouth: up
    courtyard: [40.18, 0.0, 10.64, 7.67]
  - ref: J2
    type: "USB-A receptacle"
    part: "Neltron 5075AR-04-WH"
    lcsc: null
    x_mm: 31.0
    y_mm: 31.6
    rotation_deg: 180
    edge: bottom
    mouth: down
    courtyard: [22.85, 25.6, 16.3, 9.4]

placements:
  - ref: U1
    value: RP2040
    package: "QFN-56 7x7 mm"
    x_mm: 24.0
    y_mm: 17.0
    rotation_deg: 270
    w_mm: 8.4
    h_mm: 8.4
