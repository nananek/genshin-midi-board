    package: "SOT-23-6"
    x_mm: 29.5
    y_mm: 23.3
    w_mm: 4.2
    h_mm: 3.5
  - ref: U7
    value: USBLC6-2SC6
    package: "SOT-23-6"
    x_mm: 12.0
    y_mm: 10.3
    w_mm: 4.2
    h_mm: 3.5
  - ref: U8
    value: USBLC6-2SC6
    package: "SOT-23-6"
    x_mm: 40.4
    y_mm: 10.5
    w_mm: 4.2
    h_mm: 3.5
  - ref: X1
    value: 12MHz
    package: "3225-4pin"
    x_mm: 15.5
    y_mm: 17.2
    w_mm: 4.3
    h_mm: 3.6
  - ref: X2
    value: 12MHz
    package: "3225-4pin"
    x_mm: 47.5
    y_mm: 19.5
    w_mm: 4.3
    h_mm: 3.6
  - ref: D1
    value: BAT54WS
    package: "SOD-323"
    x_mm: 9.5
    y_mm: 2.5
    w_mm: 2.0
    h_mm: 3.3
    rotation_deg: 90
  - ref: D2
    value: BAT54WS
    package: "SOD-323"
    x_mm: 37.6
    y_mm: 4.3
    w_mm: 3.3
    h_mm: 2.0
