rules:
  - id: "no-advanced-via"
    text: "0.5 mm diameter / 0.3 mm drill のスルービアだけを使う。0.15 mm ドリル、レーザービア、盲埋め込みビアは使わない。"
  - id: "no-via-in-pad"
    text: "SMD パッド内にビアを置かない。Type-C A7/B7 と QFN-56 サーマルパッドはドッグボーンで逃がす。"
  - id: "tented-not-plugged"
    text: "ビアは tented のまま。plugged / capped / filled にしない。"
  - id: "usb-pair"
    text: "USB D+/D- は同一層を基本とし、長さ差 2 mm 以内。USB-A 側は 22R、native USB は 27R の直列抵抗をコネクタ近傍に置く。"
  - id: "type-c-spacing"
    text: "USB-C 2 ポートの中心間距離は 25 mm 以上、コートヤード間の隙間は 15 mm 以上。"
  - id: "qspi"
    text: "QSPI は RP2040 から U2 まで 25 mm 以内、等長 2 mm 以内、スタブなし。"
  - id: "crystal"
    text: "水晶は XIN/XOUT の近くに置き、GND ガードと短い配線にする。"
  - id: "thermal"
    text: "RP2040 のサーマルパッドは F.Cu の GND と接続し、パッド外のビアで In1 GND へ落とす。"
